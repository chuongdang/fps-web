# Test the game behind nginx:  docker compose up --build   →  http://localhost:8000
# The game container is not published; only nginx is reachable from the host.
services:
  game:
    build: .
    restart: unless-stopped
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${FPS_PROXY_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      game:
        condition: service_healthy
